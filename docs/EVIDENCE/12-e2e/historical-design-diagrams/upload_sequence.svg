<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35736f"/></marker></defs>
    <rect width="1200" height="800" fill="#f6f9fb"/>
    <text x="50" y="60" font-family="Helvetica" font-size="30" fill="#182c45" font-weight="bold">Local upload interaction sequence</text>
    <text x="50" y="95" font-family="Helvetica" font-size="16" fill="#466077">File-level errors return 400/413; infrastructure failures return 503. No automatic scoring follows upload.</text>
    <rect x="15" y="150" width="250" height="52" rx="12" fill="white" stroke="#35736f" stroke-width="2"/><text x="140.0" y="182" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#182c45">Analyst browser</text><line x1="140" y1="202" x2="140" y2="715" stroke="#839cae" stroke-dasharray="7 6"/><rect x="315" y="150" width="250" height="52" rx="12" fill="white" stroke="#35736f" stroke-width="2"/><text x="440.0" y="182" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#182c45">Flask local adapter</text><line x1="440" y1="202" x2="440" y2="715" stroke="#839cae" stroke-dasharray="7 6"/><rect x="620" y="150" width="250" height="52" rx="12" fill="white" stroke="#35736f" stroke-width="2"/><text x="745.0" y="182" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#182c45">CSV processor</text><line x1="745" y1="202" x2="745" y2="715" stroke="#839cae" stroke-dasharray="7 6"/><rect x="925" y="150" width="250" height="52" rx="12" fill="white" stroke="#35736f" stroke-width="2"/><text x="1050.0" y="182" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#182c45">PostgreSQL / mock S3</text><line x1="1050" y1="202" x2="1050" y2="715" stroke="#839cae" stroke-dasharray="7 6"/><line x1="140" y1="250" x2="440" y2="250" stroke="#35736f" stroke-width="2"/><polygon points="440,250 430.0,246.0 430.0,254.0" fill="#35736f"/><text x="290.0" y="238" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">POST /v1/upload</text><line x1="440" y1="325" x2="745" y2="325" stroke="#35736f" stroke-width="2"/><polygon points="745,325 735.0,321.0 735.0,329.0" fill="#35736f"/><text x="592.5" y="313" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">Bound file; derive content identity</text><line x1="745" y1="400" x2="1050" y2="400" stroke="#35736f" stroke-width="2"/><polygon points="1050,400 1040.0,396.0 1040.0,404.0" fill="#35736f"/><text x="897.5" y="388" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">Write validated rows</text><line x1="1050" y1="470" x2="745" y2="470" stroke="#35736f" stroke-width="2" stroke-dasharray="6 5"/><polygon points="745,470 755.0,474.0 755.0,466.0" fill="#35736f"/><text x="897.5" y="458" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">Accepted / constraint failures</text><line x1="745" y1="540" x2="1050" y2="540" stroke="#35736f" stroke-width="2"/><polygon points="1050,540 1040.0,536.0 1040.0,544.0" fill="#35736f"/><text x="897.5" y="528" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">Store rejected rows in quarantine</text><line x1="745" y1="610" x2="440" y2="610" stroke="#35736f" stroke-width="2" stroke-dasharray="6 5"/><polygon points="440,610 450.0,614.0 450.0,606.0" fill="#35736f"/><text x="592.5" y="598" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">Counts and rejection details</text><line x1="440" y1="680" x2="140" y2="680" stroke="#35736f" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,680 150.0,684.0 150.0,676.0" fill="#35736f"/><text x="290.0" y="668" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#182c45">200 JSON result (partial success possible)</text><text x="600" y="758" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#182c45">Synchronous local upload. AWS S3-triggered ingestion has a different asynchronous entry point.</text></svg>