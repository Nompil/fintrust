name: FinTrust CI
permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q --ignore=tests/data_quality --junitxml=test-results/unit.xml

      - name: Preserve unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/unit.xml
          retention-days: 7

  integration:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintrust_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINTRUST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrust_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL constraint integration tests
        run: pytest tests/data_quality/test_constraints.py -q --junitxml=test-results/postgres.xml

      - name: Preserve database test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: test-results/postgres.xml
          retention-days: 7
