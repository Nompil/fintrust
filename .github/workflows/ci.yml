name: FinTrust Linux verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Disposable CI service only; never an application database credential.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintrust_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      FINTRUST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrust_test
      AWS_REGION: af-south-1
      AWS_DEFAULT_REGION: af-south-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Confirm Linux release environment
        run: |
          python3.12 - <<'PY'
          import platform, sys
          print(platform.platform(), platform.machine(), sys.version)
          assert platform.system() == "Linux"
          assert platform.machine() == "x86_64"
          assert platform.python_implementation() == "CPython"
          assert sys.version_info[:2] == (3, 12)
          PY
      - name: Build hardened release with production wheels
        run: |
          mkdir -p build/hardened-release
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o build/hardened-release/global-bundle.pem
          python3.12 tools/package_hardened_lambda.py \
            --ca-bundle build/hardened-release/global-bundle.pem \
            --output build/release1-candidate/fintrust-release1-linux-py312.zip
      - name: Check exact built content and source binding
        run: python3.12 tools/verify_release_input.py build/release1-candidate/fintrust-release1-linux-py312.zip
      - name: Verify built handlers and all production modules
        run: |
          set -o pipefail
          python3.12 tools/verify_lambda_linux.py build/release1-candidate/fintrust-release1-linux-py312.zip --all-production 2>&1 | tee build/linux-verification.txt
      - name: Install approved test dependencies
        run: python3.12 -m pip install -r requirements.txt
      - name: Verify Release 1 PostgreSQL 16 service roles
        run: python3.12 tools/check_release1_roles_pg16.py
      - name: Install scoped browser verification dependency
        run: |
          npm install --prefix build/browser-tools --no-save --ignore-scripts playwright@1.62.1
          build/browser-tools/node_modules/.bin/playwright install chromium
      - name: Run Release 1 candidate browser gate
        env:
          FINTRUST_NODE: /usr/local/bin/node
          FINTRUST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: |
          export FINTRUST_NODE="$(command -v node)"
          python3.12 tools/run_release1_browser.py
      - name: Run full suite with disposable PostgreSQL
        env:
          FINTRUST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
          FINTRUST_UI_COPY_EVIDENCE: ${{ github.workspace }}/build/full-suite-browser-evidence
        run: |
          export FINTRUST_NODE="$(command -v node)"
          node --test tools/test_cloud_session.cjs
          python3.12 -m pytest -q --junitxml=test-results/pytest.xml
      - name: Record release gate evidence
        if: always()
        env:
          FINTRUST_RELEASE_ARCHIVE: build/release1-candidate/fintrust-release1-linux-py312.zip
        run: python3.12 tools/record_release_verification.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrust-hardened-verification-evidence
          path: |
            docs/EVIDENCE/11-ci/hardened-release-linux-ci.json
            docs/EVIDENCE/11-ci/hardened-release-linux-ci.md
            build/linux-verification.txt
            build/release1-candidate/fintrust-release1-linux-py312.manifest.json
            test-results/pytest.xml
            build/full-suite-browser-evidence/
            docs/EVIDENCE/12-e2e/release1-closure/postgres16-roles.json
            docs/EVIDENCE/12-e2e/release1-lifecycle/browser/
            build/release1-lifecycle/row-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish only the verified release
        uses: actions/upload-artifact@v4
        with:
          name: fintrust-release1-linux-py312
          path: |
            build/release1-candidate/fintrust-release1-linux-py312.zip
            build/release1-candidate/fintrust-release1-linux-py312.manifest.json
            docs/EVIDENCE/11-ci/hardened-release-linux-ci.json
            docs/EVIDENCE/11-ci/hardened-release-linux-ci.md
            build/linux-verification.txt
            test-results/pytest.xml
            docs/EVIDENCE/12-e2e/release1-closure/postgres16-roles.json
            docs/EVIDENCE/12-e2e/release1-lifecycle/browser/
            build/release1-lifecycle/row-results.json
          if-no-files-found: error
          retention-days: 30
