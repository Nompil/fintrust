name: FinTrust Lambda package verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --ignore=tests/data_quality
      - name: Build shared Linux runtime
        run: |
          mkdir -p build
          curl --fail --silent --show-error https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o build/global-bundle.pem
          python tools/package_lambda.py --ca-bundle build/global-bundle.pem
      - name: Import packaged handlers on Linux
        run: python tools/verify_lambda_linux.py build/fintrust.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fintrust-lambda
          path: |
            build/fintrust.zip
            build/fintrust.manifest.json
          retention-days: 7
